name: setup action

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04-arm
            tools: gluon rg cpython
            check: ninja --version && meson --version && rg --version && python3 -c 'import ssl, sqlite3, ctypes'
          - os: ubuntu-26.04
            tools: cpython
            check: python3 -c 'import ssl, sqlite3, ctypes'
          - os: xcode-27
            tools: gluon rg ffmpeg-runtime
            check: ninja --version && meson --version && rg --version && ffmpeg -version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./setup
        with:
          tools: ${{ matrix.tools }}
          lock: .github/setup-smoke.lock.json
      - run: ${{ matrix.check }}

  cached:
    name: cached (${{ matrix.os }})
    needs: install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04-arm
            tools: gluon rg cpython
            check: ninja --version && meson --version && rg --version && python3 -c 'import ssl, sqlite3, ctypes'
          - os: ubuntu-26.04
            tools: cpython
            check: python3 -c 'import ssl, sqlite3, ctypes'
          - os: xcode-27
            tools: gluon rg ffmpeg-runtime
            check: ninja --version && meson --version && rg --version && ffmpeg -version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./setup
        with:
          tools: ${{ matrix.tools }}
          lock: .github/setup-smoke.lock.json
      - run: test "${{ steps.setup.outputs.cache-hit }}" = true
      - run: ninja --version
